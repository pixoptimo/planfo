<article class="page-detail">
  <div class="container article-reading-container">
    <header class="article-header" style="text-align: left; border-bottom: 2px solid var(--color-border-dark);">
      <span class="card-category">Document</span>
      <h1 class="page-title" style="margin-top: 8px;"><%= page.title %></h1>
    </header>

    <% if (page.featuredImage) { %>
      <div style="margin-bottom: 36px;">
        <img src="<%= page.featuredImage %>" alt="<%= page.title %>" style="width: 100%; border-radius: var(--radius-md);">
      </div>
    <% } %>

    <div class="article-content">
      <%- renderContent(page.content) %>
    </div>
  </div>
</article>
