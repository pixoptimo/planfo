<div class="landing-page">
  <div class="container article-reading-container">
    <header class="editorial-hero" style="text-align: center; margin-bottom: 48px; border-bottom: 2px solid var(--color-border-dark);">
      <span class="hero-kicker">Special Edition &bull; <%= page.title %></span>
      <h1 class="hero-title" style="margin: 12px auto; max-width: 800px;"><%= page.title %></h1>
      <% if (page.featuredImage) { %>
        <div style="margin: 32px 0 16px;">
          <img src="<%= page.featuredImage %>" alt="<%= page.title %>" style="width: 100%; border-radius: var(--radius-md);">
        </div>
      <% } %>
    </header>

    <div class="landing-content cms-rendered-content">
      <%- renderContent(page.content) %>
    </div>
  </div>
</div>
