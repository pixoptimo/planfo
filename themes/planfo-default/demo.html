<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixoptimo Live Studio — Interactive Template Demo & Device Simulator</title>
  <meta name="description" content="Test and preview HTML templates across Desktop, Tablet, and Mobile viewport modes with real-time hardware frame emulation. Upload and preview any custom HTML page instantly.">
  <meta name="author" content="Pixoptimo">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/demo.css">
</head>
<body class="demo-body">

  <!-- Studio Header Bar -->
  <header class="demo-studio-bar" id="studioBar">
    <div class="demo-left-group">
      <a href="index.html" class="back-link" id="backToCatalogLink" title="Return to Template Catalog">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span>Catalog</span>
      </a>
      <a href="details.html" class="back-link" id="detailsLink" title="View Template Details">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span>Details</span>
      </a>
    </div>

    <!-- Center: Device Switcher, Width Dimension, & Expand to Normal UI -->
    <div class="demo-center-group">
      <div class="device-controls-group" role="group" aria-label="Device Viewport Switcher">
        <button class="device-btn active" data-mode="desktop" id="btnModeDesktop" title="Full Desktop Viewport">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          <span>Desktop</span>
        </button>

        <button class="device-btn" data-mode="tablet" id="btnModeTablet" title="Tablet Viewport (768px)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
          <span>Tablet</span>
        </button>

        <button class="device-btn" data-mode="mobile" id="btnModeMobile" title="Mobile Viewport (390px)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
          <span>Mobile</span>
        </button>
      </div>

      <div class="viewport-dimension-badge" id="dimensionBadge">
        100% Normal View
      </div>

      <button class="icon-control-btn" id="expandBtn" title="Expand View (Show Normal UI)" aria-label="Expand to Normal UI">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
    </div>

    <!-- Right End: Download Button -->
    <div class="demo-right-group">
      <button class="btn btn-sm btn-primary" id="downloadCurrentBtn" title="Download Template Source Code">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download
      </button>
    </div>
  </header>

  <!-- Floating Close Button on Right Top in Normal View -->
  <button class="floating-close-btn" id="floatingCloseBtn" title="Close (Return to Simulator)" aria-label="Close Normal View">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>

  <!-- Main Viewport Canvas Stage -->
  <main class="demo-stage" id="demoStage">
    <div class="device-wrapper mode-desktop" id="deviceWrapper">
      <div class="mobile-bezel-island" aria-hidden="true"></div>
      <iframe id="demoIframe" class="demo-iframe" title="Interactive UI Template Preview" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>
    </div>
  </main>

  <!-- Scripts -->
  <% if (typeof templates !== 'undefined' && Array.isArray(templates) && templates.length > 0) { %>
  <%
    const jsonSerialize = typeof safeJson === 'function' ? safeJson : (o => JSON.stringify(o).replace(/</g, '\\u003c').replace(/>/g, '\\u003e'));
  %>
  <script id="planfo-demo-templates-data" type="application/json"><%- jsonSerialize(templates.map(item => {
      const d = item.data || {};
      return {
        id: item.slug,
        title: item.title || item.name || '',
        category: d.category || 'SaaS & Dashboard',
        categorySlug: d.categorySlug || 'saas',
        badge: d.badge || (d.isFree ? 'Free' : 'PRO'),
        badgeColor: d.badgeColor || 'purple',
        tagline: d.tagline || item.excerpt || '',
        description: d.description || item.excerpt || '',
        thumbnail: item.featuredImage || d.thumbnail || ('assets/images/' + item.slug + '.jpg'),
        featuredImage: item.featuredImage || d.featuredImage || ('assets/images/' + item.slug + '.jpg'),
        demoUrl: typeof d.demoUrl === 'string' ? d.demoUrl : ('demos/' + item.slug + '/index.html'),
        downloadFile: typeof d.downloadFile === 'string' ? d.downloadFile : (d.demoUrl || ('demos/' + item.slug + '/bundle.zip')),
        version: d.version || 'v1.0.0',
        releaseDate: d.releaseDate || 'Sept 2026',
        lastUpdated: d.lastUpdated || 'Oct 2026',
        license: d.license || 'MIT Commercial & Personal',
        price: d.price || 'Free',
        isFree: d.isFree ?? (d.price === 'Free'),
        rating: Number(d.rating) || 4.98,
        reviewCount: Number(d.reviewCount) || 120,
        downloads: String(d.downloads || '10,000+'),
        author: d.author || 'Pixoptimo Labs',
        techStack: Array.isArray(d.techStack) ? d.techStack : (typeof d.techStack === 'string' ? d.techStack.split(',').map(s=>s.trim()).filter(Boolean) : ['HTML5 Semantic', 'Vanilla CSS3']),
        fileSize: d.fileSize || '14.2 KB (Gzipped)'
      };
    })) %></script>
  <script>
    try {
      var __rawDemoData = document.getElementById('planfo-demo-templates-data');
      if (__rawDemoData && (!window.TEMPLATES_DATA || !window.TEMPLATES_DATA.length)) {
        window.TEMPLATES_DATA = JSON.parse(__rawDemoData.textContent || '[]');
      }
    } catch (e) {}
  </script>
  <% } %>
  <script src="assets/js/templates-data.js"></script>
  <script src="assets/js/demo.js"></script>
</body>
</html>
